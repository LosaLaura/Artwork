<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubble</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #viewport {
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: grab;
      background-color: #000;
      background-image: url("background.png");
      background-size: contain;
      background-repeat: no-repeat;
      image-rendering: pixelated;
    }
    #viewport:active {
      cursor: grabbing;
    }
    #yurrr {
      position: relative;
      width: min(100vw, 177.78dvh);
      height: min(100dvh, 56.25vw);
      transform-origin: center center;
    }
    #yurrr img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      visibility: hidden;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="yurrr"></div>
  </div>
  <script>
    const viewport = document.getElementById("viewport");
    const container = document.getElementById("yurrr");
    const totalFrames = 39;
    const fps = 12;
    const frames = new Array();
    const loadPromises = new Array();

    for (let i = 1; i <= totalFrames; i++) {
      const frameImg = document.createElement("img");
      frameImg.src = `frame${i}.png`;
      const ready = frameImg.decode().catch(() => {});
      loadPromises.push(ready);
      frames.push(frameImg);
      container.appendChild(frameImg);
    }

    Promise.all(loadPromises).then(() => {
      let current = 0;
      frames.at(0).style.visibility = "visible";

      setInterval(() => {
        frames.at(current).style.visibility = "hidden";
        current = (current + 1) % totalFrames;
        frames.at(current).style.visibility = "visible";
      }, 1000 / fps);
    });

    let scale = 1;
    let panX = 0;
    let panY = 0;
    let isDragging = false;
    let startX = 0;
    let startY = 0;

    function updateTransform() {
      container.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    viewport.addEventListener("wheel", (e) => {
      e.preventDefault();
      const zoomFactor = 0.1;
      if (e.deltaY < 0) {
        scale = Math.min(scale + zoomFactor, 10);
      } else {
        scale = Math.max(scale - zoomFactor, 0.2);
      }
      updateTransform();
    }, { passive: false });

    viewport.addEventListener("mousedown", (e) => {
      isDragging = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener("mouseup", () => {
      isDragging = false;
    });
  </script>
</body>
</html>
